# Phase 2+ datastore. The Phase 1 spike does not use it.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: fix
      POSTGRES_PASSWORD: fix
      POSTGRES_DB: fix
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
