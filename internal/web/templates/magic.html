{{define "content"}}
<h1><span class="logo" aria-hidden="true">FA</span>Sign in</h1>
{{if .Error}}
  <p class="flash error" role="alert">{{.Error}}</p>
  <p><a class="button" href="/login">Request a new link</a></p>
{{else}}
  <form method="post" action="/auth/magic" class="card">
    <input type="hidden" name="token" value="{{.Data.Token}}">
    <p style="margin-top:0">One last click to continue to Fix Assistant.</p>
    <p style="margin-bottom:0"><button type="submit" data-busy="Signing in…">Sign in</button></p>
  </form>
  <p class="small muted">This extra click stops email link scanners from using up your link.</p>
{{end}}
{{end}}
