{{define "content"}}
{{template "project_nav" .}}
<nav class="tabs">
  {{$cur := .Data.Status}}{{$id := .Data.Project.ID}}
  {{range .Data.Tabs}}<a class="{{if eq .Value $cur}}on{{end}}" href="/projects/{{$id}}/issues?status={{.Value}}"
     hx-get="/projects/{{$id}}/issues?status={{.Value}}" hx-target="#issues" hx-select="#issues" hx-swap="outerHTML" hx-push-url="true">{{.Label}}</a>{{end}}
</nav>
{{template "issues_table" .Data}}
{{end}}
