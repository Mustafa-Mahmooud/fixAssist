{{define "layout"}}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} · Fix Assistant</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body{{if .Session}} hx-headers='{"X-CSRF-Token": "{{.Session.CSRF}}"}'{{end}}>
{{if .Session}}
  <header class="top">
    <a class="brand" href="/projects">Fix Assistant</a>
    <nav><a href="/projects">Projects</a>{{if .Session.Staff}}<a href="/admin">Admin</a>{{end}}</nav>
    <span class="muted small">{{.Session.Email}}</span>
    <form method="post" action="/logout"><input type="hidden" name="csrf" value="{{.Session.CSRF}}"><button class="link">Sign out</button></form>
  </header>
  <main>{{template "content" .}}</main>
{{else}}
  <main class="narrow">{{template "content" .}}</main>
{{end}}
</body>
</html>{{end}}
