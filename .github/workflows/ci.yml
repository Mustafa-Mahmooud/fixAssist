name: ci

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fix
          POSTGRES_PASSWORD: fix
          POSTGRES_DB: fix_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fix -d fix_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: test (unit + Postgres; packages share fix_test, so -p 1)
        run: go test -p 1 ./...
        env:
          FIX_TEST_DATABASE_URL: postgres://fix:fix@localhost:5432/fix_test?sslmode=disable
      - name: sqlc generated code is up to date
        run: |
          curl -fsSL https://downloads.sqlc.dev/sqlc_1.29.0_linux_amd64.tar.gz | tar -xz -C /usr/local/bin sqlc
          sqlc diff
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: built SDK add-on is up to date
        working-directory: pkg/sdk-addon
        run: |
          npm ci
          npm run build
          git diff --exit-code dist/
          npm run size --silent

  image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64 # Google Cloud e2-micro (x86)
          push: true
          tags: ${{ steps.name.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Northflank (docs/deploy-free.md): every push to main that passes the tests
  # is built and deployed by Northflank, the exact commit that was tested, then
  # checked on /healthz. Off until the repository variables
  # NORTHFLANK_PROJECT_ID and NORTHFLANK_SERVICE_ID are set; also needs the
  # secret NORTHFLANK_API_TOKEN. Turn off the service's own "CI" auto-build in
  # Northflank, or untested pushes deploy too (and everything builds twice).
  northflank:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.NORTHFLANK_PROJECT_ID != '' && vars.NORTHFLANK_SERVICE_ID != ''
    runs-on: ubuntu-24.04
    environment: production
    concurrency:
      group: northflank-production
      cancel-in-progress: false # never stop a rollout halfway; the next push waits
    timeout-minutes: 45
    steps:
      - name: build and deploy ${{ github.sha }}
        env:
          NF_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
          NF_SERVICE: https://api.northflank.com/v1/projects/${{ vars.NORTHFLANK_PROJECT_ID }}/services/${{ vars.NORTHFLANK_SERVICE_ID }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$NF_TOKEN" ]; then echo "::error::The NORTHFLANK_API_TOKEN secret is missing"; exit 1; fi
          nf() { # nf METHOD PATH [JSON]
            curl -sS --fail-with-body --retry 3 --retry-all-errors -X "$1" "$NF_SERVICE$2" \
              -H "Authorization: Bearer $NF_TOKEN" -H "Content-Type: application/json" ${3:+--data "$3"}
          }

          build=$(nf POST /build "{\"sha\":\"$SHA\"}" | jq -r .data.id)
          echo "Northflank build $build for $SHA"

          # The build: Northflank clones this commit and builds the Dockerfile.
          for _ in $(seq 1 180); do # up to 30 minutes
            b=$(nf GET "/build/$build")
            if [ "$(jq -r .data.concluded <<<"$b")" = true ]; then break; fi
            echo "build: $(jq -r .data.status <<<"$b")"
            sleep 10
          done
          if [ "$(jq -r .data.success <<<"$b")" != true ]; then
            echo "::error::Build $build ended as $(jq -r .data.status <<<"$b"): $(jq -r '.data.message // ""' <<<"$b")"
            exit 1
          fi
          echo "build succeeded"

          # The rollout: wait until the service runs this commit.
          for _ in $(seq 1 60); do # up to 10 minutes
            s=$(nf GET "")
            state=$(jq -r .data.status.deployment.status <<<"$s")
            deployed=$(jq -r '.data.deployment.internal.deployedSHA // ""' <<<"$s")
            echo "deployment: $state, running ${deployed:0:7}"
            if [ "$state" = FAILED ]; then echo "::error::Deployment failed: $(jq -c .data.status.deployment <<<"$s")"; exit 1; fi
            if [ "$state" = COMPLETED ] && [ "$deployed" = "$SHA" ]; then exit 0; fi
            sleep 10
          done
          echo "::error::The deployment didn't finish within 10 minutes"; exit 1

      - name: health check
        if: vars.APP_PUBLIC_URL != ''
        env:
          URL: ${{ vars.APP_PUBLIC_URL }}
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS --max-time 10 "${URL%/}/healthz"; then echo; echo "live: $URL"; exit 0; fi
            sleep 10
          done
          echo "::error::${URL%/}/healthz didn't answer with 200 within 5 minutes"; exit 1

  # The self-hosted VM deploy (deploy/, docs/deploy.md). Off unless the
  # repository variable VM_DEPLOY is "true": Northflank (docs/deploy-free.md)
  # builds from GitHub by itself.
  deploy:
    needs: image
    if: vars.VM_DEPLOY == 'true'
    runs-on: ubuntu-24.04
    environment: production
    concurrency: production
    permissions:
      contents: read
      packages: read # the server logs in to GHCR with this job's token to pull
    steps:
      - uses: actions/checkout@v4
      - name: ssh setup
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
      - name: copy deploy files
        run: |
          scp -q deploy/compose.yml deploy/Caddyfile deploy/deploy.sh deploy/backup.sh deploy/restore-test.sh deploy/geoip.sh \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/fixassist/"
          scp -q deploy/postgres/Dockerfile "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/fixassist/postgres/"
      - name: release
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "docker login ghcr.io -u '${{ github.actor }}' --password-stdin >/dev/null && /opt/fixassist/deploy.sh '${{ needs.image.outputs.image }}'"
